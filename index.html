<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KING's ChatBot</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark"}catch{}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow"></div>

<!-- Sign in / sign up -->
<section id="auth" class="auth">
  <form id="authForm" class="card" autocomplete="on">
    <h1>KING's ChatBot</h1>
    <p class="sub" id="authSub">Log in to see your saved chats.</p>
    <div class="tabs">
      <button type="button" id="tabLogin" class="on">Log in</button>
      <button type="button" id="tabSignup">Sign up</button>
    </div>
    <input id="user" placeholder="Username" autocomplete="username" required maxlength="20">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password" required minlength="6">
    <p id="authErr" class="err" role="alert"></p>
    <button id="authBtn" class="primary">Log in</button>
    <p class="credit">Created by KING_YOSEF_</p>
  </form>
</section>

<!-- App -->
<div id="app" class="app" hidden>
  <aside id="side">
    <button id="newChat" class="primary">+ New chat</button>
    <nav id="list" aria-label="Chat history"></nav>
    <div class="who">
      <span id="me"></span>
      <button id="logout" class="ghost">Log out</button>
    </div>
    <p class="credit">Created by KING_YOSEF_</p>
  </aside>
  <div id="scrim"></div>

  <section class="panel">
    <header>
      <button id="menu" class="ghost" aria-label="Open chat history">☰</button>
      <h1>KING's ChatBot</h1>
      <button id="theme" class="ghost" aria-label="Switch theme">
        <svg class="sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
    </header>
    <main id="chat" aria-live="polite"></main>
    <div id="preview" class="preview" hidden></div>
    <form id="form" autocomplete="off">
      <label class="icon" title="Attach an image">
        <input type="file" id="file" accept="image/*" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
      </label>
      <textarea id="input" rows="1" placeholder="Message, or math like 2^10 + sqrt(81)"></textarea>
      <button id="send" class="primary">Send</button>
    </form>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>
<script src="script.js"></script>
</body>
</html>
