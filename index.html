<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KING's ChatBot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>KING's ChatBot</h1>
    <button id="clear" title="Start a new chat">New chat</button>
  </header>

  <main id="chat" aria-live="polite">
    <div class="msg bot">Hi, I'm KING's ChatBot. Ask me anything, send a math problem, or attach an image.</div>
  </main>

  <div id="preview" class="preview" hidden></div>

  <form id="form" autocomplete="off">
    <label class="icon" title="Attach an image">
      <input type="file" id="file" accept="image/*" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
    </label>
    <textarea id="input" rows="1" placeholder="Message, or a math problem like 2^10 + sqrt(81)"></textarea>
    <button type="submit" id="send">Send</button>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>
<script src="script.js"></script>
</body>
</html>
